# The smoke suite, against a Supabase stack built inside the runner.
#
# WHY NOT A HOSTED PROJECT. These scripts need a service_role key, which
# bypasses every RLS policy: total read/write on whatever it points at. Against
# production that is a breach waiting to happen — and the scripts also create
# real users and rows and undo them in a `finally`, which is a poor thing to do
# to the database serving users on every pull request. The obvious fix, a second
# hosted project, is not available: Supabase's free plan allows one project per
# organisation, and this repo has a standing no-spending constraint until
# February 2027 (ROADMAP.md).
#
# `supabase start` removes the problem instead of containing it. The runner
# builds Postgres, Auth and PostgREST in Docker, the suite runs against that,
# and the whole thing is destroyed with the runner. There is no real credential
# to protect: the local stack's anon and service_role keys are fixed values
# published in Supabase's own documentation, identical on every machine. So the
# secret that needed guarding does not exist here.
#
# It is also a STRONGER check than a shared CI project would have been. The
# schema is built from supabase/migrations from nothing on every run, so a
# migration that changes an invariant other tests depend on fails here. That is
# exactly what went unnoticed on 2026-09-07, when new AFTER DELETE audit
# triggers silently changed what every fixture leaves behind and broke cleanup
# in three scripts. A long-lived CI project would have drifted the same way
# production did.
#
# WHAT IT DOES NOT CHECK: the local stack has no connection pooler, so every
# script gets session semantics whichever mode it asked for. See the fidelity
# note in scripts/lib/pg.ts — running the suite against the hosted project from
# a maintainer's machine is still worth doing before anything ships.
#
# WHY A SEPARATE WORKFLOW FROM ci.yml. It is slower (the stack takes a minute or
# two to boot) and it needs Docker, so keeping it beside the fast build check
# would slow every pull request down for everyone.
name: Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Each run builds its own database, so runs no longer contend over shared rows
# and a cancelled run cannot strand fixtures — the database dies with the
# runner. That is why this may cancel in progress and is keyed per ref, unlike
# the repo-wide serialisation a shared project forced.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke · local stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Boots Postgres + Auth + PostgREST and applies supabase/migrations and
      # supabase/seed.sql from empty. Docker is preinstalled on ubuntu-latest.
      - name: Start the local Supabase stack
        run: npx supabase start

      # `supabase status -o env` prints the stack's own addresses and keys. Read
      # them rather than hardcoding: the ports come from supabase/config.toml and
      # would drift silently if copied here.
      #
      # None of this is secret. These are the local stack's fixed development
      # credentials, the same on every machine and published in Supabase's docs.
      - name: Point the scripts at the local stack
        run: |
          set -euo pipefail
          npx supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a

          # DB_URL has the shape <scheme>://<user>:<password>@<host>:<port>/<db>.
          # Written with metavariables on purpose: a literal example here is
          # indistinguishable from a committed credential, and check:secrets
          # flags it — correctly.
          db_password=$(printf '%s' "$DB_URL" | sed -E 's#^[^:]+://[^:]+:([^@]+)@.*#\1#')
          db_port=$(printf '%s' "$DB_URL" | sed -E 's#.*@[^:]+:([0-9]+)/.*#\1#')

          {
            # Anything but the production ref, so assertTargetIsSafeForCI() is
            # satisfied deliberately rather than by accident.
            echo "SUPABASE_PROJECT_REF=local"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_HOST=127.0.0.1"
            echo "SUPABASE_DB_PORT=$db_port"
            echo "SUPABASE_DB_PASSWORD=$db_password"
          } >> "$GITHUB_ENV"

      # Belt and braces: prove the guard is armed before running anything that
      # writes. If SUPABASE_PROJECT_REF failed to reach the environment, the
      # scripts would fall back to the production ref -- this asserts they will
      # refuse, so a broken step above fails here rather than somewhere that
      # writes rows.
      - name: Verify the production guard is armed
        run: |
          set -euo pipefail
          echo "target ref: ${SUPABASE_PROJECT_REF:-<unset>}"
          [ "${SUPABASE_PROJECT_REF:-}" = "local" ] || {
            echo "SUPABASE_PROJECT_REF is not 'local' — refusing to continue."
            exit 1
          }
          CI=1 SUPABASE_PROJECT_REF=kfxfnqryfmuxiwlswyyn npx tsx -e '
            import { assertTargetIsSafeForCI } from "./scripts/lib/env.ts";
            try {
              assertTargetIsSafeForCI();
              console.error("GUARD DID NOT FIRE against the production ref.");
              process.exit(1);
            } catch {
              console.log("guard fires against the production ref, as designed.");
            }
          '

      # Sequential on purpose. They share one database and several claim the
      # first matching row they find, so running them in parallel makes them
      # fight each other rather than test anything.
      - name: smoke · auth + profile
        run: npm run smoke:auth-profile

      - name: smoke · post write
        run: npm run smoke:post-write

      - name: smoke · live surfaces
        run: npm run smoke:live-surfaces

      - name: smoke · moderation
        run: npm run smoke:moderation

      - name: smoke · block enforcement
        run: npm run smoke:block-enforcement

      - name: smoke · deal redemption race
        run: npm run smoke:deal-race

      - name: smoke · admin privilege model
        run: npm run smoke:admin

      - name: smoke · verification guards
        run: npm run smoke:verification-guards

      - name: smoke · routes
        run: npm run smoke:routes

      # The committed baseline for RLS. Drift means a policy changed without
      # supabase/policy-snapshot.json being updated — and because this database
      # was built from the migration list alone, it also proves the migrations
      # reproduce the policy set, not just the database somebody edited by hand.
      - name: RLS snapshot check
        run: npm run audit:rls -- --check

      - name: Stop the local stack
        if: always()
        run: npx supabase stop --no-backup || true
