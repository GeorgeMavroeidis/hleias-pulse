name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # CLAUDE.md's hard rule is that no .env, password, service-role key or
      # token is ever committed. Nothing enforced it until now: lint, typecheck
      # and build all pass happily on a file full of credentials. Offline and
      # dependency-free, so it costs CI nothing.
      - name: Secret scan
        run: npm run check:secrets

      - name: Typecheck
        run: npx tsc --noEmit

      # All three suites are offline: pure functions plus node:assert.
      # They need no Supabase credentials and make no network calls.
      - name: Test — area intelligence
        run: npm run test:intelligence

      - name: Test — discovery
        run: npm run test:discovery

      - name: Test — map visuals
        run: npm run test:map-visuals

      - name: Build
        run: npm run build
