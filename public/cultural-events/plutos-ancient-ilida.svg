<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Ancient theater at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1f4d"/>
      <stop offset="45%" stop-color="#7a4dd8"/>
      <stop offset="75%" stop-color="#e06a32"/>
      <stop offset="100%" stop-color="#f4a15c"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe3b0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1420"/>
      <stop offset="100%" stop-color="#0e0a12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="600" cy="430" r="260" fill="url(#sun)"/>
  <circle cx="600" cy="430" r="130" fill="#ffdca0" opacity="0.9"/>

  <!-- distant hills -->
  <path d="M0,560 Q200,500 420,545 T860,530 T1200,560 L1200,620 L0,620 Z" fill="#1e1330" opacity="0.6"/>

  <!-- amphitheater tiers -->
  <g fill="#120a17">
    <path d="M0,760 Q600,600 1200,760 L1200,900 L0,900 Z"/>
  </g>
  <g stroke="#2b1c33" stroke-width="6" fill="none" opacity="0.8">
    <path d="M40,720 Q600,570 1160,720"/>
    <path d="M20,780 Q600,610 1180,780"/>
    <path d="M0,840 Q600,650 1200,840"/>
  </g>

  <!-- columns silhouette -->
  <g fill="#150c1a">
    <rect x="120" y="470" width="26" height="200"/>
    <rect x="200" y="440" width="26" height="230"/>
    <rect x="960" y="440" width="26" height="230"/>
    <rect x="1040" y="470" width="26" height="200"/>
    <rect x="90" y="450" width="290" height="18"/>
    <rect x="830" y="450" width="290" height="18"/>
  </g>

  <!-- comedy mask emblem, centered stage -->
  <g transform="translate(600,650)">
    <ellipse cx="0" cy="0" rx="120" ry="140" fill="#fff8ec" opacity="0.96"/>
    <ellipse cx="-42" cy="-30" rx="16" ry="20" fill="#171411"/>
    <ellipse cx="42" cy="-30" rx="16" ry="20" fill="#171411"/>
    <path d="M-55,45 Q0,105 55,45 Q0,80 -55,45 Z" fill="#171411"/>
    <path d="M-70,-70 Q-40,-95 -10,-78" stroke="#171411" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M70,-70 Q40,-95 10,-78" stroke="#171411" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- olive branch accents -->
  <g stroke="#e06a32" stroke-width="5" fill="#e06a32" opacity="0.85">
    <path d="M420,760 q40,-30 80,-10" fill="none"/>
    <ellipse cx="440" cy="748" rx="10" ry="6"/>
    <ellipse cx="465" cy="742" rx="10" ry="6"/>
    <ellipse cx="490" cy="742" rx="10" ry="6"/>
    <path d="M780,760 q-40,-30 -80,-10" fill="none"/>
    <ellipse cx="760" cy="748" rx="10" ry="6"/>
    <ellipse cx="735" cy="742" rx="10" ry="6"/>
    <ellipse cx="710" cy="742" rx="10" ry="6"/>
  </g>
</svg>
